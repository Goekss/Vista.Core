# Azure Ubuntu VM'e otomatik deploy (CI + CD)
#
# Gerekli GitHub Secrets (Repo Settings -> Secrets and variables -> Actions):
#   AZURE_VM_HOST      : Azure VM public IP veya DNS adresi
#   AZURE_VM_USER      : SSH kullanıcı adı (örn. azureuser)
#   AZURE_VM_SSH_KEY   : Özel SSH anahtarı (PEM formatı)
#   GHCR_PAT           : GitHub Personal Access Token (read:packages) — image çekmek için
#
# Deploy adımı varsayılan olarak KAPALI. Hazır olduğunda:
#   Settings -> Secrets and variables -> Actions -> Variables -> AZURE_DEPLOY_ENABLED = true
#
# VM'de önceden yapılması gerekenler (bir kez):
#   1) Docker kurulu olsun (curl -fsSL https://get.docker.com | sh)
#   2) /opt/vista klasörü oluşturulsun
#   3) /opt/vista/.env dosyasına gerçek değerler yazılsın (JWT, SMTP, MSSQL şifresi vs.)
#
# Not: ghcr.io image adı küçük harf olmalı. Repo/owner değişirse IMAGE değerini güncelle.

name: Vista CI/CD (Azure VM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # elle tetikleme

env:
  IMAGE: ghcr.io/goekss/vista-core
  DEPLOY_DIR: /opt/vista

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Vista.Core.slnx

      - name: Build
        run: dotnet build Vista.Core.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Vista.Core.slnx --no-build --configuration Release --verbosity minimal

  build-and-push:
    name: Docker build & push (GHCR)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: GHCR'ye giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Image build & push
        uses: docker/build-push-action@v6
        with:
          context: ./Vista.Core
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Azure VM'e deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    steps:
      - name: Kodu al (compose dosyası için)
        uses: actions/checkout@v4

      - name: docker-compose.azure.yml dosyasını VM'e kopyala
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: docker-compose.azure.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Image'i çek ve servisleri başlat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ env.DEPLOY_DIR }}
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.azure.yml pull
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.azure.yml up -d --remove-orphans
            docker image prune -f
